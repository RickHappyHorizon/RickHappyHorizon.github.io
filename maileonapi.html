<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <title>Zapier Store Data</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre-wrap;
        margin: 2rem;
      }
    </style>
  </head>
  <body>
    <script>
      async function main() {
        const url = 'https://store.zapier.com/api/records?secret=6251511b-743b-4031-83b3-b71e9929aee4';
        document.body.textContent = 'Bezig met ophalen...';

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();

          function toPlainText(obj, prefix = '') {
            let out = '';
            if (obj === null || typeof obj !== 'object') {
              out += prefix + String(obj) + '\n';
            } else if (Array.isArray(obj)) {
              obj.forEach((v, i) => {
                out += toPlainText(v, prefix + '[' + i + '] ');
              });
            } else {
              for (const key in obj) {
                const val = obj[key];
                if (val !== null && typeof val === 'object') {
                  out += toPlainText(val, prefix + key + '.');
                } else {
                  out += prefix + key + ': ' + String(val) + '\n';
                }
              }
            }
            return out;
          }

          document.body.textContent = toPlainText(data);
        } catch (err) {
          document.body.textContent = 'Fout bij ophalen:\n' + err.message;
        }
      }

      main();
    </script>
  </body>
</html>
